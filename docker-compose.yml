version: '3'
services:
  ui:
    build:
      context: ./ui
      args:
        FLOTILLA_API: http://localhost:3000/api/v1
        DEFAULT_CLUSTER: default
        REACT_APP_API_TOKEN: ${FLOTILLA_UI_API_TOKEN}
    environment:
      FLOTILLA_API: http://localhost:3000/api/v1
      DEFAULT_CLUSTER: default
    ports:
      - 5000:5000
      
  flotilla:
    build: .
    environment:
      DATABASE_URL: postgresql://flotilla:flotilla@db/flotilla?sslmode=disable
      FLOTILLA_MODE: dev
      HTTP_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:5000
      HTTP_SERVER_API_KEYS: ${FLOTILLA_API_KEYS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - 3000:3000
  db:
    image: postgres
    environment:
      POSTGRES_USER: flotilla
      POSTGRES_DB: flotilla
      POSTGRES_PASSWORD: flotilla
    ports:
      - 5432:5432
